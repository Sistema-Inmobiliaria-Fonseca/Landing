<header class="header">
  <div class="header__barra">
    <div class="contenedor header__contenido">
      <a class="marca" href="#inicio" (click)="cerrarMenu()">
        <img
          class="marca__logo"
          src="/images/logo.jpeg"
          alt="Logo de la inmobiliaria"
          width="1236"
          height="1600"
        />
        <span class="marca__texto">
          <span class="marca__nombre">{{ sitio.nombre }}</span>
        </span>
      </a>

      <nav class="nav-principal" aria-label="Navegación principal">
        <ul class="nav-principal__lista">
          @for (enlace of navegacion; track enlace.id) {
            <li>
              <a class="nav-principal__enlace" [href]="'#' + enlace.id" (click)="cerrarMenu()">
                {{ enlace.etiqueta }}
              </a>
            </li>
          }
        </ul>
      </nav>

      <div class="header__acciones">
        <a class="boton boton--primario header__cta" href="#contacto" (click)="cerrarMenu()">
          Contacto
        </a>

        <a
          class="boton-icono header__user"
          [href]="loginAdmin"
          aria-label="Ingresar al panel de administración"
          title="Ingresar al panel de administración"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5" />
            <path d="M4.5 20a7.5 7.5 0 0 1 15 0" />
          </svg>
        </a>

        <button
          type="button"
          class="boton-icono header__hamburguesa"
          (click)="alternarMenu()"
          [attr.aria-expanded]="menuAbierto()"
          aria-controls="menu-movil"
          [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'"
        >
          @if (menuAbierto()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          }
        </button>
      </div>
    </div>
  </div>

  @if (menuAbierto()) {
    <div class="menu-movil">
      <nav class="contenedor" aria-label="Navegación móvil">
        <ul class="menu-movil__lista">
          @for (enlace of navegacion; track enlace.id) {
            <li>
              <a class="menu-movil__enlace" [href]="'#' + enlace.id" (click)="cerrarMenu()">
                {{ enlace.etiqueta }}
              </a>
            </li>
          }
        </ul>
        <a class="boton boton--primario boton--bloque" href="#contacto" (click)="cerrarMenu()">
          Contacto
        </a>
      </nav>
    </div>
  }
</header>
